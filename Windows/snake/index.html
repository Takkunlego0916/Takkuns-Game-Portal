<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>スネーク | Takkun's Game Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <h1 class="title">スネーク</h1>

    <div class="scoreboard">
      <div class="score-box">
        <div class="label">スコア</div>
        <div id="score" class="value">0</div>
      </div>
      <div class="score-box">
        <div class="label">ベスト</div>
        <div id="best" class="value">0</div>
      </div>
      <div class="score-box">
        <div class="label">速度</div>
        <div id="speedLevel" class="value">1</div>
      </div>
    </div>

    <div id="boardWrap">
      <canvas id="board" width="400" height="400"></canvas>
    </div>

    <div class="controls">
      <button id="pauseBtn" class="btn-outline">一時停止</button>
      <label class="wrap-toggle">
        <input type="checkbox" id="wrapToggle" />
        壁を貫通する
      </label>
      <button id="newBtn" class="btn-red">New Game</button>
    </div>

    <div id="dpad" aria-hidden="true">
      <button id="dpadUp" class="dpad-btn dpad-up">▲</button>
      <button id="dpadLeft" class="dpad-btn dpad-left">◀</button>
      <button id="dpadRight" class="dpad-btn dpad-right">▶</button>
      <button id="dpadDown" class="dpad-btn dpad-down">▼</button>
    </div>

    <p class="hint">矢印キー / WASD / スワイプで移動、スペースキーで一時停止</p>
  </div>

  <div id="overlay" class="overlay">
    <div class="panel">
      <h2 id="ov-title"></h2>
      <div id="ov-msg"></div>
      <button id="retry" class="btn-red">リトライ</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
